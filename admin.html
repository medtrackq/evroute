<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>หลังบ้าน · EVROUTE</title>
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="light dark">
  <script>try { var t = localStorage.getItem('theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}</script>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/admin.css">
</head>
<body>
  <main class="adm">
    <header class="adm__head">
      <div>
        <a href="./" class="adm__back">← กลับไปที่แอป</a>
        <h1>หลังบ้าน EVROUTE</h1>
        <p class="hint" id="adm-when">กำลังโหลด…</p>
      </div>
      <button type="button" class="btn" id="adm-reload">โหลดใหม่</button>
    </header>
    <div id="adm-body"></div>
    <section class="card adm-card" id="adm-cars" hidden>
      <h2>รุ่นรถ <small id="car-count">เพิ่มหรือแก้ที่นี่ ผู้ใช้เห็นทันที ไม่ต้องแก้โค้ดหรือ deploy</small></h2>
      <div class="adm-cars__bar">
        <input id="car-q" class="field" type="search" placeholder="ค้นหายี่ห้อหรือรุ่น">
        <button type="button" class="btn btn--primary" id="car-new">+ เพิ่มรุ่นรถ</button>
      </div>
      <form id="car-form" class="adm-carform" hidden novalidate>
        <h3 id="car-form-title">เพิ่มรุ่นรถ</h3>
        <div class="adm-carform__grid">
          <label>ยี่ห้อ<input id="cf-brand" class="field" list="cf-brands" maxlength="30" placeholder="เช่น AVATR"></label>
          <label>รุ่น<input id="cf-model" class="field" maxlength="60" placeholder="เช่น 12 Long Range"></label>
          <label>รหัสรุ่น (id)<input id="cf-id" class="field" maxlength="40" placeholder="สร้างให้เองจากยี่ห้อและรุ่น"></label>
          <label>แบตที่ใช้ได้ (kWh)<input id="cf-kwh" class="field" type="number" step="0.1" min="10" max="200"></label>
          <label>กินไฟ (kWh/100 กม. ขับจริง)<input id="cf-use" class="field" type="number" step="0.1" min="8" max="40"></label>
          <label>DC สูงสุด (kW)<input id="cf-dc" class="field" type="number" step="1" min="0" max="400"></label>
          <label>AC สูงสุด (kW)<input id="cf-ac" class="field" type="number" step="0.1" min="0" max="22" placeholder="7"></label>
          <fieldset class="adm-plugs"><legend>หัวชาร์จ DC</legend>
            <label><input type="checkbox" value="CCS2" checked> CCS2</label>
            <label><input type="checkbox" value="CHAdeMO"> CHAdeMO</label>
            <label><input type="checkbox" value="GBT"> GB/T</label>
            <label><input type="checkbox" value="Tesla"> Tesla</label>
          </fieldset>
          <label class="adm-carform__wide">หมายเหตุ / แหล่งข้อมูล<input id="cf-note" class="field" maxlength="200" placeholder="เช่น ลิงก์สเปกจากผู้ผลิต"></label>
        </div>
        <p class="hint">แบตใช้ "แบตที่ใช้ได้" ถ้าผู้ผลิตบอกแค่ความจุรวม ใช้ราว 94% · กินไฟใช้ค่าขับจริง ไม่ใช่ตัวเลขโฆษณา (NEDC/CLTC มักต่ำไป 20–30%)</p>
        <p class="sheet__msg" id="cf-err" role="alert"></p>
        <div class="adm-carform__acts">
          <button type="submit" class="btn btn--primary">บันทึก</button>
          <button type="button" class="btn" id="cf-cancel">ยกเลิก</button>
          <button type="button" class="btn sheet__danger" id="cf-hide" hidden>ซ่อนรุ่นนี้</button>
          <button type="button" class="btn" id="cf-revert" hidden>ลบการแก้ไข</button>
        </div>
        <datalist id="cf-brands"></datalist>
      </form>
      <div id="car-list"></div>
    </section>
  </main>
  <script src="assets/js/cars.js"></script>
  <script src="assets/js/admin.js"></script>
</body>
</html>
